<!doctype html>
<html lang="en">
  <head>
    <script>
      // Prevent libraries from crashing if they try to write/modify window.fetch
      try {
        const nativeFetch = window.fetch;
        let currentFetch = nativeFetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return currentFetch;
          },
          set(val) {
            currentFetch = val;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn("Fetch guard initialization skipped:", e);
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Das Converter</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
